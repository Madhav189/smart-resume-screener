<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Details</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .back-button {
            border: none;
            width: auto;
            margin: 0 0 20px 0;
            padding: 11px 20px;
            background: #334155;
            color: white;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        .back-button:hover {
            background: #1e293b;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            color: #1e3a8a;
        }

        .header p {
            color: #64748b;
        }

        .candidate-header {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .candidate-name {
            font-size: 26px;
            font-weight: bold;
            color: #0f172a;
        }

        .filename {
            color: #64748b;
            margin-top: 8px;
        }

        .rank {
            color: #475569;
            margin-top: 8px;
        }

        .score {
            font-size: 34px;
            font-weight: bold;
            color: #2563eb;
        }

        .decision {
            margin-top: 8px;
            font-weight: bold;
        }

        .shortlisted {
            color: #15803d;
        }

        .rejected {
            color: #dc2626;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
            margin-bottom: 20px;
        }

        .card h2 {
            margin-top: 0;
            color: #1e293b;
        }

        .candidate-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .info-box {
            background: #f8fafc;
            padding: 18px;
            border-radius: 10px;
        }

        .info-box h3 {
            margin-top: 0;
            color: #1e3a8a;
        }

        .category {
            margin-top: 20px;
        }

        .category h3 {
            color: #1e3a8a;
            margin-bottom: 12px;
        }

        .requirement-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .matched-box,
        .missing-box {
            padding: 18px;
            border-radius: 10px;
        }

        .matched-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }

        .missing-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        .matched-title {
            color: #15803d;
            font-weight: bold;
        }

        .missing-title {
            color: #dc2626;
            font-weight: bold;
        }

        ul {
            margin-top: 10px;
            padding-left: 22px;
        }

        li {
            margin-bottom: 7px;
        }

        .justification {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            line-height: 1.6;
        }

        .not-found {
            text-align: center;
            color: #64748b;
            padding: 30px;
        }

        @media (max-width: 700px) {

            .candidate-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .requirement-grid,
            .candidate-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <button
        class="back-button"
        onclick="goBack()"
    >
        ← Back to Ranking
    </button>

    <div class="header">
        <h1>Candidate Details</h1>
        <p>AI-powered resume screening analysis</p>
    </div>

    <div id="candidateContent"></div>

</div>

<script>

const candidateData =
    sessionStorage.getItem(
        "selectedCandidate"
    );

if (!candidateData) {

    document.getElementById(
        "candidateContent"
    ).innerHTML = `
        <div class="card not-found">
            <h2>Candidate not found</h2>
            <p>Please return to the ranking page.</p>
        </div>
    `;

} else {

    try {

        const candidate =
            JSON.parse(candidateData);

        displayCandidate(candidate);

    } catch (error) {

        document.getElementById(
            "candidateContent"
        ).innerHTML = `
            <div class="card not-found">
                <h2>Unable to load candidate</h2>
            </div>
        `;

    }

}

function displayCandidate(candidate) {

    const analysis =
        candidate.analysis || {};

    const requirements =
        analysis.requirements || {};

    const candidateInfo =
        candidate.candidate || {};

    const decision =
        analysis.shortlist;

    const decisionClass =
        decision === "Yes"
            ? "shortlisted"
            : "rejected";

    const decisionText =
        decision === "Yes"
            ? "✓ Shortlisted"
            : "✕ Not Shortlisted";

    const score =
        Number(
            analysis.match_score || 0
        ).toFixed(1);

    document.getElementById(
        "candidateContent"
    ).innerHTML = `

        <div class="candidate-header">

            <div>

                <div class="candidate-name">
                    ${escapeHtml(
                        candidateInfo.name ||
                        candidate.filename ||
                        "Unknown Candidate"
                    )}
                </div>

                <div class="filename">
                    Resume:
                    ${escapeHtml(
                        candidate.filename || ""
                    )}
                </div>

                <div class="rank">
                    Rank #${candidate.rank || "-"}
                </div>

                <div class="decision ${decisionClass}">
                    ${decisionText}
                </div>

            </div>

            <div class="score">
                ${score}/10
            </div>

        </div>

        <div class="card">

            <h2>Candidate Information</h2>

            <div class="candidate-info">

                <div class="info-box">
                    <h3>Education</h3>
                    ${createList(
                        candidateInfo.education
                    )}
                </div>

                <div class="info-box">
                    <h3>Skills</h3>
                    ${createList(
                        candidateInfo.skills
                    )}
                </div>

                <div class="info-box">
                    <h3>Experience</h3>
                    ${createList(
                        candidateInfo.experience
                    )}
                </div>

                <div class="info-box">
                    <h3>Projects</h3>
                    ${createList(
                        candidateInfo.projects
                    )}
                </div>

                <div class="info-box">
                    <h3>Certifications</h3>
                    ${createList(
                        candidateInfo.certifications
                    )}
                </div>

            </div>

        </div>

        <div class="card">

            <h2>Requirement Analysis</h2>

            ${createCategory(
                "Academic Requirements",
                requirements.academic
            )}

            ${createCategory(
                "Technical Requirements",
                requirements.technical
            )}

            ${createCategory(
                "Soft Skills",
                requirements.soft_skills
            )}

            ${createCategory(
                "Behavioral Requirements",
                requirements.behavioral
            )}

        </div>

        <div class="card">

            <h2>AI Justification</h2>

            <div class="justification">
                ${escapeHtml(
                    analysis.justification || ""
                )}
            </div>

        </div>

    `;

}

function createCategory(
    title,
    requirement
) {

    requirement =
        requirement || {};

    return `

        <div class="category">

            <h3>
                ${title}
            </h3>

            <div class="requirement-grid">

                <div class="matched-box">

                    <div class="matched-title">
                        Matched
                    </div>

                    ${createList(
                        requirement.matched
                    )}

                </div>

                <div class="missing-box">

                    <div class="missing-title">
                        Missing
                    </div>

                    ${createList(
                        requirement.missing
                    )}

                </div>

            </div>

        </div>

    `;

}

function createList(items) {

    if (!Array.isArray(items)) {
        items = [];
    }

    if (items.length === 0) {
        return "<ul><li>None</li></ul>";
    }

    return `
        <ul>
            ${
                items.map(
                    item =>
                        `<li>${escapeHtml(item)}</li>`
                ).join("")
            }
        </ul>
    `;

}

function goBack() {

    window.history.back();

}

function escapeHtml(text) {

    if (
        text === null ||
        text === undefined
    ) {
        return "";
    }

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
